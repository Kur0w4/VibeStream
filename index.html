<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#010409" />
  <meta name="description" content="VibeStream — Discover and stream music powered by YouTube." />
  <title>VibeStream</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Preconnect: eliminates DNS + TLS handshake delay for critical third parties -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.youtube.com" />
  <link rel="dns-prefetch" href="https://i.ytimg.com" />

  <!-- Google Fonts: loaded as a non-render-blocking <link> instead of CSS @import -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
